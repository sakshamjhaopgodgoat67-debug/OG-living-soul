<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Living Soul — OG AI</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05050f;
    --soul: #7c5cff;
    --soul-glow: #a78bfa;
    --text: #e2e8f0;
    --glass: rgba(255, 255, 255, 0.05);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    background-image: 
      radial-gradient(ellipse at 20% 20%, rgba(124, 92, 255, 0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(167, 139, 250, 0.1) 0%, transparent 50%);
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 25px 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header { text-align: center; margin-bottom: 20px; }

  .logo {
    font-size: 2.6rem;
    font-weight: 700;
    background: linear-gradient(135deg, #c4b5fd, #7c5cff, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }

  .tagline { font-size: 0.95rem; color: #94a3b8; margin-bottom: 18px; }

  /* Mode Selector */
  .mode-selector {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }

  select {
    background: rgba(124, 92, 255, 0.15);
    border: 1px solid rgba(124, 92, 255, 0.4);
    color: #e2e8f0;
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
    cursor: pointer;
    min-width: 220px;
  }

  select option { background: #0f0f1a; }

  .chat-box {
    flex: 1;
    background: var(--glass);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 20px;
    overflow-y: auto;
    max-height: 48vh;
    margin-bottom: 15px;
  }

  .message {
    margin-bottom: 16px;
    display: flex;
    gap: 10px;
    animation: fadeIn 0.35s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user { flex-direction: row-reverse; }

  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; flex-shrink: 0;
  }

  .avatar.soul {
    background: linear-gradient(135deg, #7c5cff, #a78bfa);
    box-shadow: 0 0 15px rgba(124, 92, 255, 0.45);
  }

  .avatar.user { background: #1e293b; border: 1px solid #334155; }

  .bubble {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 0.95rem;
  }

  .message.soul .bubble {
    background: rgba(124, 92, 255, 0.15);
    border: 1px solid rgba(124, 92, 255, 0.25);
    border-bottom-left-radius: 4px;
  }

  .message.user .bubble {
    background: rgba(30, 41, 59, 0.85);
    border: 1px solid rgba(255,255,255,0.08);
    border-bottom-right-radius: 4px;
  }

  /* Painting Canvas */
  #paintingArea {
    display: none;
    background: #111;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 15px;
    text-align: center;
  }

  #paintCanvas {
    background: white;
    border-radius: 8px;
    cursor: crosshair;
    max-width: 100%;
    touch-action: none;
  }

  .paint-controls {
    margin-top: 12px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .paint-controls button, .paint-controls input {
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }

  .input-area {
    background: var(--glass);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 10px;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  #userInput {
    flex: 1;
    background: transparent;
    border: none;
    color: white;
    font-size: 1rem;
    padding: 11px 14px;
    outline: none;
    font-family: inherit;
  }

  .btn {
    width: 46px; height: 46px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    transition: 0.2s;
  }

  .btn-mic { background: rgba(124, 92, 255, 0.2); color: #c4b5fd; }
  .btn-mic.listening { background: #ef4444; color: white; }
  .btn-send { background: linear-gradient(135deg, #7c5cff, #a78bfa); color: white; }

  .status {
    text-align: center;
    font-size: 0.8rem;
    color: #64748b;
    margin-top: 10px;
    min-height: 18px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">Living Soul</div>
    <div class="tagline">An OG AI • Multiple Brains</div>

    <div class="mode-selector">
      <select id="modeSelect">
        <option value="normal">Normal Mode</option>
        <option value="roast">Roast Mode</option>
        <option value="fun">Fun Mode</option>
        <option value="career">Career Mode</option>
        <option value="webdev">Web Development</option>
        <option value="gamedev">Game Development</option>
        <option value="aidev">AI Development</option>
        <option value="painting">Painting Mode</option>
      </select>
    </div>
  </header>

  <!-- Painting Area -->
  <div id="paintingArea">
    <canvas id="paintCanvas" width="700" height="400"></canvas>
    <div class="paint-controls">
      <input type="color" id="colorPicker" value="#7c5cff">
      <input type="range" id="brushSize" min="1" max="30" value="5">
      <button onclick="clearCanvas()">Clear</button>
    </div>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="message soul">
      <div class="avatar soul">✦</div>
      <div class="bubble">I am Living Soul. Choose a mode and speak to me.</div>
    </div>
  </div>

  <div class="input-area">
    <button class="btn btn-mic" id="micBtn">🎤</button>
    <input type="text" id="userInput" placeholder="Speak or type..." autocomplete="off"/>
    <button class="btn btn-send" id="sendBtn">➤</button>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
  const chatBox = document.getElementById('chatBox');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const status = document.getElementById('status');
  const modeSelect = document.getElementById('modeSelect');
  const paintingArea = document.getElementById('paintingArea');

  // ===== Painting Setup =====
  const canvas = document.getElementById('paintCanvas');
  const ctx = canvas.getContext('2d');
  let painting = false;

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  function startPosition(e) {
    painting = true;
    draw(e);
  }
  function endPosition() {
    painting = false;
    ctx.beginPath();
  }
  function draw(e) {
    if (!painting) return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX || e.touches[0].clientX) - rect.left;
    const y = (e.clientY || e.touches[0].clientY) - rect.top;

    ctx.lineWidth = document.getElementById('brushSize').value;
    ctx.strokeStyle = document.getElementById('colorPicker').value;
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  }

  canvas.addEventListener('mousedown', startPosition);
  canvas.addEventListener('mouseup', endPosition);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('touchstart', startPosition);
  canvas.addEventListener('touchend', endPosition);
  canvas.addEventListener('touchmove', draw);

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // Mode change
  modeSelect.addEventListener('change', () => {
    if (modeSelect.value === 'painting') {
      paintingArea.style.display = 'block';
      chatBox.style.maxHeight = '30vh';
    } else {
      paintingArea.style.display = 'none';
      chatBox.style.maxHeight = '48vh';
    }
  });

  // Voice
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isListening = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.lang = 'en-US';

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
      status.textContent = "Listening...";
    };
    recognition.onresult = (e) => {
      userInput.value = e.results[0][0].transcript;
      sendMessage();
    };
    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
      status.textContent = "";
    };
  }

  micBtn.addEventListener('click', () => {
    if (!recognition) return alert("Use Chrome for voice");
    isListening ? recognition.stop() : recognition.start();
  });

  function speak(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 0.95;
      window.speechSynthesis.speak(utter);
    }
  }

  function addMessage(text, isUser = false) {
    const div = document.createElement('div');
    div.className = `message ${isUser ? 'user' : 'soul'}`;
    div.innerHTML = `
      <div class="avatar ${isUser ? 'user' : 'soul'}">${isUser ? 'You' : '✦'}</div>
      <div class="bubble">${text}</div>
    `;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    const mode = modeSelect.value;
    addMessage(text, true);
    userInput.value = '';
    status.textContent = "Living Soul is thinking...";

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, mode: mode })
      });
      const data = await response.json();
      addMessage(data.reply);
      speak(data.reply);
    } catch (err) {
      addMessage("Connection failed.");
    }
    status.textContent = "";
  }

  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
</script>
</body>
</html>
